<section class="container py-5 text-center" style="max-width:460px;">
 <img src="{% static 'img/dinesmart-logo-icon.png' %}"

  </p>

    real inbox — scroll up there to find the reset link.-->
  </p>
  <a href="{% url 'login' %}" class="btn-outline-ink mt-3">Back to Login</a>
</section>
{% endblock %}
