{% extends "base.html" %}
{% block title %}DineSmart — Admin Login{% endblock %}

{% block content %}
<section class="container py-5" style="max-width:440px;">
 {% load static %}
<div class="text-center mb-4">

    <img src="{% static 'img/dinesmart-logo-icon.png' %}"
         alt="DineSmart Logo"
         class="auth-logo">
    <h2 class="mt-3">Staff Login</h2>
    <p style="color:var(--ink-soft);">
        For restaurant staff only — accept orders &amp; confirm bookings.
    </p>

</div>

  <div class="auth-card">
    <form method="post" action="{% url 'staff_login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn-brick w-100">Login to Dashboard</button>
    </form>
    <p class="text-center small mt-3 mb-0" style="color:var(--ink-soft);">
      Access is restricted to authorized restaurant staff.
    </p>
  </div>
</section>
{% endblock %}
