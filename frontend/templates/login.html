{% extends "base.html" %}
{% load static %}

{% block title %}DineSmart — Login{% endblock %}
{% block nav_login %}active{% endblock %}

{% block content %}
<section class="container py-5" style="max-width:460px;">
  <div class="text-center mb-4">

    <img src="{% static 'img/dinesmart-logo-icon.png' %}"
         alt="DineSmart Logo"
         class="auth-logo">

    <h2 class="mt-3">Welcome Back</h2>

    <p style="color:var(--ink-soft);">
      Log in to your DineSmart account
    </p>

  </div>

  <div class="auth-card">
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3 small">
        <label><input type="checkbox" class="form-check-input me-1">Remember me</label>
        <a href="{% url 'password_reset' %}">Forgot password?</a>
      </div>
      <button type="submit" class="btn-brick w-100">Login</button>
    </form>
    <p class="text-center small mt-3 mb-0">Don't have an account? <a href="{% url 'register' %}" style="color:var(--brick);font-weight:600;">Register</a></p>
  </div>
</section>
{% endblock %}
