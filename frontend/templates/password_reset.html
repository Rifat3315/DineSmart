{% extends "base.html" %}
{% block title %}DineSmart — Reset Password{% endblock %}

{% block content %}
<section class="container py-5" style="max-width:460px;">
  <div class="text-center mb-4">
    <span class="tikka-stamp mb-2">DS</span>
    <h2 class="mt-3">Reset Your Password</h2>
    <p style="color:var(--ink-soft);">Enter your account email and we'll send you a reset link.</p>
  </div>

  <div class="auth-card">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn-brick w-100">Send Reset Link</button>
    </form>
    <p class="text-center small mt-3 mb-0">
      Remembered it? <a href="{% url 'login' %}" style="color:var(--brick);font-weight:600;">Back to login</a>
    </p>
  </div>
</section>
{% endblock %}
